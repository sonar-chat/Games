<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stick Duel</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{height:100%;margin:0;background:#0d1020;font-family:"Arial Black","Trebuchet MS",sans-serif;color:#fff}
body{display:flex;justify-content:center;align-items:center}
#app{position:relative;width:min(100vw,calc(100dvh*1.4545));aspect-ratio:16/11;overflow:hidden;background:#000;container-type:size}
canvas{position:absolute;left:0;top:0;width:100%;height:56.25cqw}
.pp{position:absolute;bottom:0;width:50%;height:12.5cqw;z-index:2;background:#151a2b}
.tb{position:absolute;bottom:1.2cqw;width:10cqw;height:10cqw;border-radius:50%;background:#ffffff26;border:.5cqw solid #fff8;color:#fff;font-size:4cqw;padding:0;z-index:3;touch-action:none}
.tb:active{background:#ffffff66}
.tb.big{position:absolute;left:3cqw;top:1cqw;bottom:auto;width:44cqw;height:10.5cqw;border-radius:6cqw;font-size:2.8cqw;line-height:1.25;overflow:hidden}.tb.big small{font-size:1.5cqw;opacity:.8;font-family:"Trebuchet MS",sans-serif}
.kn{position:absolute;left:50%;top:50%;width:7.5cqw;height:7.5cqw;margin:-3.75cqw 0 0 -3.75cqw;border-radius:50%;background:#ffffff55;border:.3cqw solid #fff9;pointer-events:none}
#mute{position:absolute;top:1.2cqw;left:50%;transform:translateX(-50%);width:4.4cqw;height:4.4cqw;border-radius:50%;border:.2cqw solid #fff6;background:#0008;font-size:2.2cqw;padding:0;z-index:4}
.ov{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;background:radial-gradient(circle at 50% 30%,#28305a,#0d1020)}
#setup{display:flex}
h1{margin:0;font-size:6.2cqw;letter-spacing:.2cqw;text-shadow:.4cqw .4cqw 0 #ff4d4d}
.cards{display:flex;gap:2.4cqw}
.card{width:30cqw;padding:1.8cqw;border-radius:1.6cqw;background:#ffffff14;border:.35cqw solid #ffffff40}
.card label{display:block;font-size:1.5cqw;margin-bottom:.8cqw;opacity:.85}
.card input{width:100%;font:inherit;font-size:2.4cqw;padding:.8cqw 1.2cqw;border-radius:1cqw;border:0;background:#fff;color:#151a2b;margin-bottom:1.2cqw;user-select:text}
.sw{display:flex;gap:.9cqw;flex-wrap:wrap}
.sw i{width:3.4cqw;height:3.4cqw;border-radius:50%;border:.35cqw solid #fff4}.sw i.sel{border-color:#fff;transform:scale(1.15)}
.go,.ov button{font:inherit;font-size:2.6cqw;padding:1cqw 4cqw;border:0;border-radius:1.4cqw;background:#ffd23f;color:#151a2b;box-shadow:0 .4cqw 0 #b8901a}
.hint{font-size:1.4cqw;opacity:.7}
.sw i.tg{width:auto;height:auto;border-radius:.8cqw;padding:.3cqw 1cqw;font-style:normal;font-size:1.3cqw;background:#ffffff22;border-width:.2cqw}.sw i.tg.sel{background:#ffd23f;color:#151a2b;transform:none}
#end h2{margin:0;font-size:6cqw}
</style></head><body>
<div id="app"><canvas id="cv" width="1600" height="900"></canvas><button id="mute">🔊</button>
<div class="ov" id="setup"></div><div class="ov" id="end"></div></div>
<script>
const $=s=>document.querySelector(s),W=800,H=450,GY=390,CL=["#ff4d4d","#3da5ff","#2ecc71","#ffd23f","#b86bff","#ff8a2b","#ff5fb0","#dfe6ee"];
const TH=[["#ff9a5a","#4b2e83","#2a1a4a","#7a5aa0","#3a2a55",0],["#ffe29a","#ff9a4d","#d9743a","#f2b45a","#b8703a",1],["#0b1030","#2b2f77","#141a4a","#3f8a5a","#1c3d30",1],["#cfe8ff","#f4fbff","#9bb8d6","#fff","#b9cde0",1],["#3b0a0a","#a8310e","#1d0707","#ff7a1a","#2a1010",1]];
const WP={sword:{r:66,d:14,c:.4},hammer:{r:56,d:24,c:.8},pistol:{r:0,d:10,c:.35},spear:{r:84,d:12,c:.45}};
const c=$("#cv").getContext("2d"),cfg={n:["Red","Blue"],c:[0,1],h:[1,3],cpu:0},K=[{},{}];
let hs=0,fx=[],P=[],pl=[],sh=[],crates=[],bul=[],pts=[],wins=[0,0],round=1,th=0,mode="setup",it=0,kot=0,said=0,ct=3,shake=0,last=0,mute=false,ac;
const R=(a,b)=>a+Math.random()*(b-a);
function initAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function tone(f,d,ty,v,f2,t0){if(!ac||mute)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+(t0||0);o.type=ty||"square";o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v||.15,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}
function noise(d,v){if(!ac||mute)return;const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=ac.createBufferSource(),g=ac.createGain();g.gain.value=v;s.buffer=b;s.connect(g);g.connect(ac.destination);s.start()}
function sfx(k){if(k=="jump")tone(380,.14,"square",.1,800);if(k=="swing")noise(.12,.12);if(k=="hit"){noise(.2,.4);tone(140,.2,"sawtooth",.2,50)}
if(k=="shoot"){noise(.1,.3);tone(900,.12,"square",.12,200)}if(k=="pick")[660,880,1100].forEach((f,j)=>tone(f,.1,"triangle",.2,0,j*.07));
if(k=="go")tone(880,.3,"triangle",.25,1200);if(k=="ko"){noise(.6,.4);tone(200,.7,"sawtooth",.25,40)}
if(k=="win")[523,659,784,1047,784,1047,1319].forEach((f,j)=>tone(f,.22,"triangle",.22,0,j*.12))}
function say(m){if(mute||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m);u.rate=1.05;u.pitch=.9;speechSynthesis.speak(u)}catch(e){}}
$("#mute").onclick=()=>{mute=!mute;$("#mute").textContent=mute?"🔇":"🔊";if(mute&&window.speechSynthesis)speechSynthesis.cancel()};

function setupUI(){let h='<h1>STICK DUEL</h1><div class="cards">';
[0,1].forEach(i=>{h+=`<div class="card"><label>Player ${i+1} name</label><input id="in${i}" maxlength="10" value="${cfg.n[i]}"><label>Colour</label><div class="sw" id="sw${i}"></div><label style="margin-top:1cqw">Hat</label><div class="sw" id="ht${i}"></div></div>`});
h+='</div><div class="sw" id="md" style="justify-content:center"></div><button class="go" id="go">Fight</button><div class="hint">Each player has one button: tap to jump, drag left or right to move. Fighters attack automatically when close. First to 3 rounds wins.</div>';
$("#setup").innerHTML=h;
[0,1].forEach(i=>{const w=$("#sw"+i);CL.forEach((col,j)=>{const s=document.createElement("i");s.style.background=col;if(cfg.c[i]==j)s.className="sel";s.onclick=()=>{cfg.c[i]=j;[...w.children].forEach(x=>x.classList.remove("sel"));s.classList.add("sel")};w.appendChild(s)});$("#in"+i).oninput=e=>cfg.n[i]=e.target.value});
const HN=["None","Cap","Top hat","Crown","Band","Horns"];
[0,1].forEach(i=>{const w=$("#ht"+i);HN.forEach((n,j)=>{const s=document.createElement("i");s.className="tg"+(cfg.h[i]==j?" sel":"");s.textContent=n;s.onclick=()=>{cfg.h[i]=j;[...w.children].forEach(x=>x.classList.remove("sel"));s.classList.add("sel")};w.appendChild(s)})});
const md=$("#md");["2 Players","Player vs CPU"].forEach((n,j)=>{const s=document.createElement("i");s.className="tg"+(cfg.cpu==j?" sel":"");s.textContent=n;s.onclick=()=>{cfg.cpu=j;[...md.children].forEach(x=>x.classList.remove("sel"));s.classList.add("sel")};md.appendChild(s)});
$("#go").onclick=()=>{initAudio();cfg.n=cfg.n.map((n,i)=>n.trim()||"Player "+(i+1));if(cfg.cpu)cfg.n[1]="CPU";start()}}
function buildPad(){const app=$("#app");[0,1].forEach(i=>{const d=document.createElement("div");d.className="pp";d.id="pp"+i;d.style[i?"right":"left"]=0;
const b=document.createElement("button");b.className="tb big";b.dataset.p=i;b.innerHTML='JUMP<br><small>drag left or right to move</small><i class="kn"></i>';const kn=b.lastChild;let sx=0;
const mv=e=>{const r=b.getBoundingClientRect(),dx=e.clientX-sx,th=r.width*.07;K[i].l=dx<-th?1:0;K[i].r=dx>th?1:0;kn.style.transform=`translateX(${Math.max(-r.width*.4,Math.min(r.width*.4,dx))}px)`};
b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);sx=e.clientX;press(i,"j",1)};
b.onpointermove=e=>{if(b.hasPointerCapture(e.pointerId))mv(e)};
b.onpointerup=b.onpointercancel=()=>{K[i].l=K[i].r=0;kn.style.transform=""};
d.appendChild(b);app.appendChild(d)})}
function oldPad(){const app=$("#app"),pos=[{l:2,r:13,j:28,a:39},{l:13,r:2,j:28,a:39}];[0,1].forEach(i=>{const d=document.createElement("div");d.className="pp";d.id="pp"+i;d.style[i?"right":"left"]=0;app.appendChild(d)});
[0,1].forEach(i=>[["l","◀"],["r","▶"],["j","⤒"],["a","⚔"]].forEach(([k,t])=>{const b=document.createElement("button");b.className="tb";b.textContent=t;b.style[i?"right":"left"]=pos[i][k]+"cqw";b.dataset.p=i;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);press(i,k,1)};b.onpointerup=b.onpointercancel=()=>press(i,k,0);app.appendChild(b)}))}
function press(i,k,v){if(k=="j"){if(v)jump(P[i])}else if(k=="a"){if(v)attack(P[i])}else K[i][k]=v}
const KM={a:[0,"l"],d:[0,"r"],w:[0,"j"],f:[0,"a"],ArrowLeft:[1,"l"],ArrowRight:[1,"r"],ArrowUp:[1,"j"],m:[1,"a"]};
addEventListener("keydown",e=>{if(e.target.tagName=="INPUT"||e.repeat)return;const m=KM[e.key]||KM[e.key.toLowerCase()];if(m){e.preventDefault();press(m[0],m[1],1)}});
addEventListener("keyup",e=>{const m=KM[e.key]||KM[e.key.toLowerCase()];if(m)press(m[0],m[1],0)});

function mk(i){return{i,x:i?640:160,y:GY,vx:0,vy:0,f:i?-1:1,hp:100,g:true,j:0,atk:0,cool:0,hd:1,wp:null,wt:0,ammo:0,st:0,sp:0,t:0,name:cfg.n[i],col:CL[cfg.c[i]],h:cfg.h[i]}}
function tint(){[0,1].forEach(i=>{const col=CL[cfg.c[i]],d=$("#pp"+i);d.style.background=`linear-gradient(#151a2b,${col}66)`;d.style.borderTop=`.5cqw solid ${col}`;document.querySelectorAll(`.tb[data-p="${i}"]`).forEach(b=>b.style.borderColor=col)})}
function start(){tint();wins=[0,0];round=1;$("#setup").style.display=$("#end").style.display="none";newRound()}
function newRound(){th=Math.floor(R(0,5));sh=[];for(let x=-20;x<W;x+=R(40,90))sh.push({x,w:R(50,110),h:R(60,170)});
pl=[{x:R(110,260),y:R(285,325),w:R(120,170)},{x:R(500,640),y:R(285,325),w:R(120,170)}];
P=[mk(0),mk(1)];crates=[];bul=[];ct=R(2,4);mode="intro";it=1.7;said=0;K[0]={};K[1]={}}
function fl(x,y,py){let f=GY;for(const q of pl)if(x>q.x-4&&x<q.x+q.w+4&&py<=q.y+2&&y>=q.y&&q.y<f)f=q.y;return f}
function jump(p){if(mode!="play"||!p||p.st>0||p.j>=2)return;p.vy=p.j?-500:-570;p.j++;p.g=false;sfx("jump");puff(p.x,p.y,4,"#fff6")}
function attack(p){if(mode!="play"||!p||p.cool>0||p.st>0)return;const w=p.wp?WP[p.wp]:{c:.35};p.atk=.22;p.cool=w.c;p.hd=0;
if(p.wp=="pistol"){if(p.ammo>0){bul.push({x:p.x+p.f*30,y:p.y-34,vx:p.f*750,o:p.i});p.ammo--;sfx("shoot");p.vx-=p.f*90;if(p.ammo<=0)p.wp=null}}else sfx("swing")}
function hurt(o,d,f,kb){o.hp=Math.max(0,o.hp-d);hs=.07;fx.push({x:o.x,y:o.y-62,v:d,l:.8});o.vx=f*kb;o.vy=-250;o.st=.28;o.g=false;puff(o.x,o.y-35,10,"#ffd23f");shake=d>20?10:5;sfx("hit");if(o.hp<=0&&mode=="play")ko(o)}
function ai(p,o,dt){const dx=o.x-p.x,ad=Math.abs(dx),w=p.wp?WP[p.wp]:{r:36},rr=w.r?w.r-8:240,k=K[1];k.l=k.r=0;
if(ad>rr+6)k[dx>0?"r":"l"]=1;else if(p.wp=="pistol"&&ad<160)k[dx>0?"l":"r"]=1;
if(Math.abs(o.y-p.y)<55&&ad<rr+16&&Math.random()<dt*4){p.f=dx>0?1:-1;attack(p)}
if((o.y<p.y-50||Math.random()<dt*.25)&&Math.random()<dt*3)jump(p)}
function ko(o){mode="ko";kot=2;wins[1-o.i]++;sfx("ko");say("K O!");shake=16}
function puff(x,y,n,col){for(let k=0;k<n;k++){const a=R(0,6.28),s=R(40,200);pts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,l:.5,m:.5,r:R(1.5,3.5),c:col})}}

function update(dt){
if(mode=="intro"){it-=dt;if(it<.6&&!said){said=1;say("Fight!");sfx("go")}if(it<=0)mode="play"}
if(mode=="ko"){kot-=dt;if(kot<=0){if(wins[0]>=3||wins[1]>=3)showEnd();else{round++;newRound()}}}
const sd=mode=="ko"?dt*.35:dt;
P.forEach(p=>{const o=P[1-p.i];if(cfg.cpu&&p.i&&mode=="play")ai(p,o,dt);if(p.hp<=0)p.rot=(p.rot||0)+sd*5;
if(mode=="play"&&p.hp>0&&o.hp>0&&p.cool<=0&&p.st<=0){const w=p.wp?WP[p.wp]:{r:36},dx=o.x-p.x,ad=Math.abs(dx);if(Math.abs(o.y-p.y)<55&&(w.r?ad<w.r+8:ad<400&&p.ammo>0)){p.f=dx>0?1:-1;attack(p)}}const k=mode=="play"?K[p.i]:{},py=p.y;p.t+=sd;
if(p.st>0)p.st-=sd;else{const d=(k.r?1:0)-(k.l?1:0),sp=p.sp>0?1.5:1;p.vx+=(d*270*sp-p.vx)*Math.min(1,sd*12);if(d&&p.atk<=0)p.f=d}
p.vy+=1500*sd;p.x=Math.max(16,Math.min(W-16,p.x+p.vx*sd));p.y+=p.vy*sd;p.g=false;
const f=fl(p.x,p.y,py);if(p.vy>=0&&p.y>=f){p.y=f;p.vy=0;p.g=true;p.j=0}
p.atk-=sd;p.cool-=sd;p.sp-=sd;if(p.wt>0){p.wt-=sd;if(p.wt<=0&&p.wp!="pistol")p.wp=null}
if(p.atk>0&&p.atk<.11&&!p.hd){p.hd=1;const w=p.wp?WP[p.wp]:{r:36,d:8};if(w.r){const dx=(o.x-p.x)*p.f;if(dx>-8&&dx<w.r+14&&Math.abs(o.y-p.y)<55&&o.hp>0)hurt(o,w.d,p.f,w.d>20?540:340)}}});
bul.forEach(b=>{b.x+=b.vx*sd;const o=P[1-b.o];if(Math.abs(b.x-o.x)<14&&b.y>o.y-62&&b.y<o.y&&o.hp>0&&mode=="play"){hurt(o,10,Math.sign(b.vx),280);b.x=-999}});bul=bul.filter(b=>b.x>0&&b.x<W);
if(mode=="play"){ct-=dt;if(ct<=0&&crates.length<2){ct=R(5,8);crates.push({x:R(60,740),y:-20,vy:0,t:["sword","hammer","pistol","heal","speed","spear"][Math.floor(R(0,6))]})}}
crates.forEach(q=>{const py=q.y;q.vy+=900*sd;q.y+=q.vy*sd;const f=fl(q.x,q.y+14,py+14)-14;if(q.y>=f){q.y=f;q.vy=0}
P.forEach(p=>{if(!q.dead&&p.hp>0&&Math.abs(q.x-p.x)<24&&Math.abs(q.y-(p.y-28))<36){q.dead=1;sfx("pick");puff(q.x,q.y,12,"#fff");
if(q.t=="heal")p.hp=Math.min(100,p.hp+35);else if(q.t=="speed")p.sp=7;else{p.wp=q.t;p.wt=q.t=="pistol"?99:9;p.ammo=8}}})});crates=crates.filter(q=>!q.dead);
pts.forEach(p=>{p.x+=p.vx*sd;p.y+=p.vy*sd;p.vy+=500*sd;p.l-=sd});pts=pts.filter(p=>p.l>0);shake=Math.max(0,shake-dt*40)}

function ln(a,b,x,y){c.beginPath();c.moveTo(a,b);c.lineTo(x,y);c.stroke()}
function oldStick(p){if(p.hp<=0){c.save();c.translate(p.x,p.y);c.rotate(Math.min(1.5,p.rot||0)*-p.f);c.translate(-p.x,-p.y)}const x=p.x,y=p.y,f=p.f,run=p.g&&Math.abs(p.vx)>40,ph=p.t*(run?16:0),bob=run?Math.abs(Math.sin(ph))*2.5:0;
c.fillStyle="#0004";c.beginPath();c.ellipse(x,GY+2,16-(GY-y)/20,4,0,0,7);c.fill();
c.strokeStyle=p.st>0&&((p.t*30|0)%2)?"#fff":p.col;c.lineWidth=5.5;c.lineCap="round";c.lineJoin="round";
const hy=y-24-bob,sy=y-44-bob;ln(x,hy,x,sy);c.fillStyle="#0d1020";c.beginPath();c.arc(x,sy-11,11,0,7);c.fill();c.stroke();
const hz=p.h,hq=sy-21;
if(hz==1){c.fillStyle="#e74c3c";c.beginPath();c.arc(x,hq+3,10,Math.PI,0);c.fill();c.fillRect(x,hq+2,f*16,4)}
if(hz==2){c.fillStyle="#222";c.fillRect(x-14,hq+3,28,4);c.fillRect(x-9,hq-14,18,17)}
if(hz==3){c.fillStyle="#ffd23f";c.beginPath();c.moveTo(x-10,hq+4);c.lineTo(x-10,hq-8);c.lineTo(x-4,hq-2);c.lineTo(x,hq-10);c.lineTo(x+4,hq-2);c.lineTo(x+10,hq-8);c.lineTo(x+10,hq+4);c.fill()}
if(hz==4){c.fillStyle="#fff";c.fillRect(x-11,hq+8,22,4);c.fillStyle="#e74c3c";c.fillRect(x-f*14,hq+8,6,4)}
if(hz==5){c.fillStyle="#ddd";c.beginPath();c.moveTo(x-9,hq+4);c.lineTo(x-14,hq-10);c.lineTo(x-3,hq);c.moveTo(x+9,hq+4);c.lineTo(x+14,hq-10);c.lineTo(x+3,hq);c.fill()}
const a=run?Math.sin(ph)*.9:.22;
if(p.g){ln(x,hy,x+Math.sin(a)*22,y);ln(x,hy,x-Math.sin(a)*22,y)}else{ln(x,hy,x+f*14,y-8);ln(x,hy,x-f*10,y)}
const arm=(th,L)=>[x+f*Math.sin(th)*L,sy+4+Math.cos(th)*L];
let e=arm(-.3-(run?Math.sin(ph)*.8:0),22);ln(x,sy+4,e[0],e[1]);
const pr=p.atk>0?1-p.atk/.22:0,th=p.atk>0?(p.wp=="pistol"?1.55:2.9-2.5*pr):(p.wp=="pistol"?1.5:.4+(run?Math.sin(ph)*.7:0));
e=arm(th,22);ln(x,sy+4,e[0],e[1]);
if(p.wp){const g=arm(th,p.wp=="sword"?58:p.wp=="spear"?80:p.wp=="hammer"?46:30);c.lineWidth=p.wp=="pistol"?6:4;c.strokeStyle=p.wp=="sword"?"#dff0ff":p.wp=="spear"?"#e8d9a8":p.wp=="hammer"?"#c9a36a":"#777";ln(e[0],e[1],g[0],g[1]);
if(p.wp=="hammer"){c.lineWidth=12;c.strokeStyle="#9aa3ad";const q=arm(th,46),z=arm(th,50);ln(q[0],q[1],z[0],z[1])}}
c.font="900 12px Arial Black,sans-serif";c.textAlign="center";c.fillStyle=p.col;c.fillText(p.name,x,sy-30);if(p.hp<=0)c.restore()}
function stick(p){const x=p.x,y=p.y,f=p.f,dead=p.hp<=0,run=p.g&&Math.abs(p.vx)>40,ph=p.t*(run?16:0),bob=run?Math.abs(Math.sin(ph))*2.5:0,col=p.st>0&&((p.t*30|0)%2)?"#fff":p.col;
c.fillStyle="#0005";c.beginPath();c.ellipse(x,GY+2,16-(GY-y)/20,4,0,0,7);c.fill();
